# Render Blueprint: one free web service + one free PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repo.
databases:
  - name: patient-intake-db
    plan: free

services:
  - type: web
    name: patient-intake-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: patient-intake-db
          property: connectionString
      - key: SEED_DATA
        value: "true"
      - key: VAPI_SECRET   # optional, see README "Security"
        sync: false
